name: rename-engine
on: workflow_dispatch
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename
        run: |
          set -e
          files=$(git ls-files | grep -v '^.github/workflows/rename-engine.yml$' | xargs grep -l 'tamil-custom\|TamilCustom' || true)
          echo "$files" | xargs sed -i \
            -e 's|org\.local\.IBus\.TamilCustom|org.local.IBus.Eluthu|g' \
            -e 's|tamil-custom|eluthu|g'
          [ -f src/ibus-engine-tamil-custom ] && git mv src/ibus-engine-tamil-custom src/ibus-engine-eluthu || true
          [ -f component/tamil-custom.xml.in ] && git mv component/tamil-custom.xml.in component/eluthu.xml.in || true
      - name: Test
        run: |
          python3 tests/test_tamil_core.py
          python3 src/ibus-engine-eluthu --selftest
          python3 tests/test_component.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Rename engine id to eluthu"
          git push
